# 버전 태그(v1.0.0 등)를 올리면 Windows 설치 파일을 만들어 GitHub Releases에 올린다.
# 받는 사람은 Releases에서 App-Architect-Studio-Setup-<버전>.exe만 받아 설치하면 된다. 같은 이름의 .sha256으로 받은 파일을 확인할 수 있다.
name: Release installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      # 태그 버전과 package.json 버전이 다르면 멈춘다 (Releases 이름과 설치 파일 이름이 어긋나지 않게)
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # Release를 먼저 초안으로 하나 만든다. 없으면 electron-builder가 파일마다 동시에 Release를 만들어
      # 같은 태그의 Release가 둘 생긴다(v1.0.0 첫 배포에서 실제로 설치 파일과 지문이 다른 Release에 갈라졌다)
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||             gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "${GITHUB_REF_NAME#v}"               --notes "설치 파일: App-Architect-Studio-Setup-${GITHUB_REF_NAME#v}.exe · 받은 파일 확인: 같은 이름의 .sha256 (README의 확인 방법)"
      - run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 설치 파일의 SHA-256 지문을 같은 Release에 올린다. 받은 사람이 README의 한 줄로 받은 파일이 그대로인지 확인한다
      # (코드 서명이 없는 동안 받은 파일을 확인하는 방법. 형식은 sha256sum과 같다: "<지문>  <파일 이름>")
      - name: SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $exe = Get-Item "release/App-Architect-Studio-Setup-*.exe"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File "$($exe.FullName).sha256" -Encoding ascii -NoNewline
          "SHA-256 ``$hash`` $($exe.Name)" >> $env:GITHUB_STEP_SUMMARY
          gh release upload $env:GITHUB_REF_NAME "$($exe.FullName).sha256" --clobber
      # 파일이 다 올라간 뒤에 한 번에 공개한다 (받는 사람이 반쯤 올라간 Release를 보지 않게)
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '[.assets[].name] | map(select(endswith(".exe") or endswith(".sha256") or . == "latest.yml")) | length')
          test "$n" = 3 || { echo "설치 파일·지문·latest.yml 중 빠진 것이 있음 ($n/3)"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
