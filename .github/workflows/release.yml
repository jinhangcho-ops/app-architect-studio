# 버전 태그(v1.0.0 등)를 올리면 Windows 설치 파일을 만들어 GitHub Releases에 올린다.
# 받는 사람은 Releases에서 App-Architect-Studio-Setup-<버전>.exe만 받아 설치하면 된다.
name: Release installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx vite build
      # 태그 버전과 package.json 버전이 다르면 멈춘다 (Releases 이름과 설치 파일 이름이 어긋나지 않게)
      - name: Check version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
